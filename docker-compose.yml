# Development environment. Open http://localhost:8090
name: eligned
services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - vite
      - reverb

  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: eligned-php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    image: eligned-php
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app

  scheduler:
    image: eligned-php
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app

  # Websockets for live updates and popups (reached by the browser through nginx at /app).
  reverb:
    image: eligned-php
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app

  vite:
    # Debian (glibc) so native packages installed on the host also work here.
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./frontend:/app

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eligned
      POSTGRES_USER: eligned
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eligned -d eligned"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email sent in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
