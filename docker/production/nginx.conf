# Production: the compiled SPA, the Laravel API and Reverb on one origin.
# Cloudflare Tunnel ends HTTPS and reaches this server at 127.0.0.1:8095 only,
# so the visitor's real address comes from Cloudflare's header.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Docker's DNS, so a recreated container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php app:9000;
    set $reverb http://reverb:8081;

    # Laravel: API, Sanctum CSRF cookie and health check.
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass $php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # The browser always arrives over HTTPS (Cloudflare).
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    # Websockets (Laravel Reverb).
    location /app/ {
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in their name: cache them for good.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Files that must update right away (app shell, service worker, manifest).
    location ~ ^/(index\.html|sw\.js|registerSW\.js|push-sw\.js|manifest\.webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
