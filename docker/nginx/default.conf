# Development: one origin (localhost:8090) for the SPA and the API,
# so Sanctum's session cookies work without CORS.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 25m;

    # Laravel: API, Sanctum CSRF cookie and health check.
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Websockets (Laravel Reverb).
    location /app/ {
        proxy_pass http://reverb:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Everything else: Vite dev server (with HMR websocket).
    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
