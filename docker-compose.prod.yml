# Production (the server). Run it through scripts/prod, which reads backend/.env:
#   scripts/prod up -d --build
# Only nginx is published, on 127.0.0.1:8095, for Cloudflare Tunnel.
name: eligned

x-php: &php
  image: eligned-php-prod
  restart: unless-stopped
  volumes:
    - ./backend/.env:/var/www/html/.env:ro
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    build:
      context: .
      dockerfile: docker/production/web.Dockerfile
    image: eligned-web-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROD_PORT:-8095}:80"
    depends_on:
      - app
      - reverb

  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/production/php.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  storage:
