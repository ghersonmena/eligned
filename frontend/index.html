<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tareas, proyectos, metas y tiempo de tu equipo en un solo lugar." />
    <meta name="theme-color" content="#F4EEE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120D0B" media="(prefers-color-scheme: dark)" />
    <title>eLigned</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
